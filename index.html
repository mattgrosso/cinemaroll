<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- viewport-fit=cover: without it iOS reports env(safe-area-inset-*) as 0
         even though the standalone PWA already draws full-bleed under the
         Dynamic Island (the 'black' status-bar style renders transparent on
         modern iOS). Geometry doesn't change — this only unlocks real inset
         values for things like the awards sticky-bar shade. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover"/>
    <meta name="theme-color" content="#000000">
    <!-- Web fonts are bundled (src/assets/scss/fonts.css), never linked from
         Google: a render-blocking stylesheet from another host is a blank
         page on a connection that isn't answering (2026-09-30). -->
    <!--[if IE]><link rel="icon" href="/img/icons/apple-touch-icon.png"><![endif]-->
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/img/icons/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/img/icons/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/img/icons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    <title>cinema-roll</title>
    <!--
      Everything from here down to the end of this head used to be injected
      at build time by
      @vue/cli-plugin-pwa (from the `pwa` block of the old vue.config.js),
      appended after the tags above and after the script/css tags. Vite
      (2026-09-14) injects nothing but its own script/link tags, so the
      injected set is now hand-written, verbatim and in the same order —
      duplicates included (a second manifest link, a second theme-color, a
      second apple-touch-icon) and the IE-conditional wrapper that plugin put
      around the original <link rel="icon"> above. The shipped <head> is thus
      the same one every installed phone has always seen; the manifest it
      points at is public/manifest.json, the plugin's generated file copied
      as-is. Note /img/icons/favicon.svg does not exist in public/ — that
      link was already there before the move and browsers fall through to
      the PNGs, so it stays for identical behaviour.
    -->
    <link rel="icon" type="image/svg+xml" href="/img/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Cinema Roll">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-152x152.png">
    <link rel="mask-icon" href="/img/icons/safari-pinned-tab.svg" color="#ffffff">
    <meta name="msapplication-TileImage" content="/img/icons/msapplication-icon-144x144.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <!--
      Launch splash (2026-10-20). Until main.js mounts, the page used to be
      plain white (the dark background is in the bundled CSS, and iOS shows
      white while a home-screen app starts). The inline style below paints
      the page dark from the first byte, and the .launch-splash inside #app
      shows the icon and name until Vue's mount replaces #app's contents —
      no script hides it, so it can never get stuck or flash early. The
      apple-touch-startup-image links give iOS the same picture to show
      before the page exists at all; scripts/generate-launch-images.mjs
      draws them to this exact layout and prints these tags.
    -->
    <style>
      html, body { background-color: #212529; }
      .launch-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #212529; color: #f8f9fa;
        font: 26px/1.2 system-ui, -apple-system, sans-serif;
      }
      .launch-splash img { width: 120px; height: 120px; margin-bottom: 14px; }
    </style>
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/img/launch/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  </head>
  <body class="bg-dark">
    <noscript>
      <strong>We're sorry but cinema-roll doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div class="launch-splash">
        <img src="/img/splash-icon.png" alt="">
        <div>Cinema Roll</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
